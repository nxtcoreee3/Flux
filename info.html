<!doctype html>
<html lang="en">
<head>
  <script>
    // Dynamic <base> so relative asset paths (style.css, script.js, assets/...)
    // resolve correctly whether the site is hosted at its own root (Vercel)
    // or reverse-proxied under a subpath like /Flux (with or without a
    // trailing slash). Must run before any other resource tag in <head>.
    (function () {
      var path = window.location.pathname;
      var base;
      var subpathMatch = path.match(/^(\/Flux)(\/|$)/i);
      if (subpathMatch) {
        base = subpathMatch[1] + '/';
      } else {
        base = path.substring(0, path.lastIndexOf('/') + 1) || '/';
      }
      document.write('<base href="' + base + '">');
    })();
  </script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Privacy Policy — Flux</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/thumbnail.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Flux">
</head>
<body>
  <div id="global-page-loader" style="position:fixed;inset:0;background:#ffffff;z-index:9999999;display:flex;justify-content:center;align-items:center;transition:opacity 0.4s ease;pointer-events:none;">
    <img src="assets/loading.gif" style="width:250px;height:auto;" alt="Loading...">
  </div>
  <script>
    // Fast Boot: hide the white loader quickly (best effort)
    (function(){
      const hide = () => {
        try { if (localStorage.getItem('flux_fast_boot') !== '1') return; } catch(e){ return; }
        const el = document.getElementById('global-page-loader');
        if (!el) return;
        el.style.opacity = '0';
        setTimeout(() => { try { el.remove(); } catch(e){} }, 420);
      };
      setTimeout(hide, 80);
      requestAnimationFrame(hide);
      window.addEventListener('pageshow', hide, { once: true });
    })();
  </script>

  <header class="topbar">
    <div class="brand">
      <a href="index.html" class="logo"><img src="assets/logo.png" alt="Flux" style="height:32px;vertical-align:middle;margin-right:6px;"> FLUX</a>
    </div>
    <nav class="nav">
      <button class="nav-toggle" aria-controls="main-nav" aria-expanded="false">☰</button>
      <ul id="main-nav" class="nav-list">
        <li data-nav-item="home"><a href="index.html">Home</a></li>
        <li data-nav-item="games"><a href="games.html">Games</a></li>
        <li data-nav-item="websites"><a href="websites.html">Websites</a></li>
        <li data-nav-item="social"><a href="social.html">Social</a></li>
        <li data-nav-item="info"><a href="info.html" class="active">Info</a></li>
        <li data-nav-item="credits"><a href="credits.html">Credits</a></li>
        <li data-nav-item="donate"><a href="donate.html" class="accent">Donate</a></li>
      </ul>
    </nav>
    <div class="right-actions">
      <a class="icon-btn" href="https://github.com/nxtcoreee3/flux" target="_blank" rel="noopener">⭐ Star</a>
    </div>
  </header>

  <main style="max-width:720px;margin:0 auto;padding:32px 16px;">

    <section class="section glass" style="margin-bottom:20px;text-align:center;">
      <h2 style="font-family:'Bebas Neue',sans-serif;font-size:36px;margin:0 0 6px;">Info</h2>
      <p style="color:var(--muted);font-size:13px;margin:0 0 28px;">Everything about how Flux works, in one place.</p>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
        <a href="roles.html" style="display:flex;flex-direction:column;align-items:center;gap:10px;padding:28px 16px;background:rgba(58,125,255,0.06);border:1px solid rgba(58,125,255,0.15);border-radius:18px;text-decoration:none;color:inherit;transition:transform 0.15s ease,box-shadow 0.15s ease;" onmouseover="this.style.transform='translateY(-3px)';this.style.boxShadow='0 10px 24px rgba(58,125,255,0.15)'" onmouseout="this.style.transform='';this.style.boxShadow=''">
          <span style="font-size:34px;">🏷️</span>
          <span style="font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:0.5px;">Roles</span>
          <span style="font-size:12px;color:var(--muted);line-height:1.4;">See every role icon and what it means</span>
        </a>

        <a href="privacypolicy.html" style="display:flex;flex-direction:column;align-items:center;gap:10px;padding:28px 16px;background:rgba(58,125,255,0.06);border:1px solid rgba(58,125,255,0.15);border-radius:18px;text-decoration:none;color:inherit;transition:transform 0.15s ease,box-shadow 0.15s ease;" onmouseover="this.style.transform='translateY(-3px)';this.style.boxShadow='0 10px 24px rgba(58,125,255,0.15)'" onmouseout="this.style.transform='';this.style.boxShadow=''">
          <span style="font-size:34px;">🔒</span>
          <span style="font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:0.5px;">Privacy Policy</span>
          <span style="font-size:12px;color:var(--muted);line-height:1.4;">How Flux handles your data</span>
        </a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <a href="index.html" class="logo-small">FLUX</a>
        <p>Built by <a href="https://github.com/nxtcoreee3" target="_blank" rel="noopener">nxtcoreee3</a></p>
      </div>
    </div>
    <small class="copyright">Flux © <span id="year3"></span></small>
  </footer>

  <script type="module" src="script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const year = document.getElementById('year3');
      if (year) year.textContent = new Date().getFullYear();

      // Safety net: any old link still pointing here with ?accept=1 (the
      // policy-gate flow) should land on the actual policy page, not the hub.
      const params = new URLSearchParams(location.search);
      if (params.get('accept') === '1') {
        window.location.replace('privacypolicy.html' + location.search);
      }
    });
  </script>

<script>
  window.addEventListener('load', () => {
    setTimeout(() => { const loader = document.getElementById('global-page-loader'); if(loader) { loader.style.opacity = '0'; setTimeout(() => loader.remove(), 400); } }, 400);
  });
</script>
</body>
</html>
