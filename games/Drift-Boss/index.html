<style>
#nxtcoreee3-notification {
  position: fixed;
  top: -120px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(20,20,20,0.95);
  backdrop-filter: blur(10px);
  color: white;
  padding: 12px 18px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-radius: 999px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.35);
  font-family: sans-serif;
  font-size: 15px;
  z-index: 999999;
  transition: top 0.5s ease;
}

#nxtcoreee3-notification img {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  object-fit: cover;
}
</style>

<script>
const notif = document.getElementById("nxtcoreee3-notification");

setTimeout(() => {
  notif.style.top = "20px"; // slide down
}, 300);

setTimeout(() => {
  notif.style.top = "-120px"; // slide up
}, 5300);
</script>
