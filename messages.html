  <script>
    // Dynamic <base> so relative asset paths (style.css, script.js, assets/...)
    // resolve correctly whether the site is hosted at its own root (Vercel)
    // or reverse-proxied under a subpath like /Flux (with or without a
    // trailing slash). Must run before any other resource tag in <head>.
    (function () {
      var path = window.location.pathname;
      var base;
      var subpathMatch = path.match(/^(\/Flux)(\/|$)/i);
      if (subpathMatch) {
        base = subpathMatch[1] + '/';
      } else {
        base = path.substring(0, path.lastIndexOf('/') + 1) || '/';
      }
      document.write('<base href="' + base + '">');
    })();
  </script>
  <script>
    // Apply dark/beta instantly before first paint to prevent flash
    (function() {
      try {
        if (localStorage.getItem('flux_dark') === '1' || 
            (localStorage.getItem('flux_dark') === null && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
        if (localStorage.getItem('flux_beta') === '1') {
          document.documentElement.classList.add('beta');
        }
      } catch(e) {}
    })();
  </script>

  <style>
    #messages-root {
      display: flex;
      max-width: 1000px;
      margin: 24px auto;
      padding: 0 16px;
      gap: 0;
      height: calc(100svh - 140px);
      min-height: 400px;
    }

    /* Sidebar */
    .convo-sidebar {
      width: 300px;
      flex-shrink: 0;
      background: var(--panel);
      border: 1px solid var(--glass-border);
      border-radius: 20px 0 0 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .convo-sidebar-header {
      padding: 16px 16px 12px;
      border-bottom: 1px solid var(--glass-border);
      flex-shrink: 0;
    }
    .convo-sidebar-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      color: var(--text);
      margin: 0 0 10px;
    }
    .tab-btn { transition: background 0.15s, color 0.15s; }
    .tab-active { background: var(--panel) !important; color: var(--text) !important; }
    .convo-sidebar-actions {
      display: flex;
      gap: 8px;
    }
    .sidebar-action-btn {
      flex: 1;
      padding: 8px;
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: border-color 0.15s;
      text-align: center;
    }
    .sidebar-action-btn:hover { border-color: var(--accent); color: var(--accent); }
    #convo-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .convo-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.1s;
    }
    .convo-item:hover { background: var(--bg); }
    .convo-item.active { background: rgba(58,125,255,0.1); }

    /* Chat panel */
    #chat-panel {
      flex: 1;
      background: var(--panel);
      border: 1px solid var(--glass-border);
      border-left: none;
      border-radius: 0 20px 20px 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .chat-header-bar {
      padding: 14px 16px;
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .back-btn {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: var(--muted);
      padding: 0;
      line-height: 1;
    }
    .back-btn:hover { color: var(--text); }
    .messages-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .messages-list::-webkit-scrollbar { width: 4px; }
    .messages-list::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 2px; }

    .message-row { display: flex; flex-direction: column; max-width: 72%; }
    .message-row.own { align-self: flex-end; align-items: flex-end; }
    .message-row.other { align-self: flex-start; align-items: flex-start; }

    .message-bubble {
      display: inline-block;
      text-align: left;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
      overflow-wrap: break-word;
      max-width: 100%;
    }
    .bubble-own {
      background: var(--accent);
      color: white;
      border-bottom-right-radius: 4px;
    }
    .bubble-other {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--glass-border);
      border-bottom-left-radius: 4px;
    }

    .message-input-bar {
      padding: 12px 16px;
      border-top: 1px solid var(--glass-border);
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
    }
    .msg-input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      font-size: 14px;
      background: var(--bg);
      color: var(--text);
      outline: none;
      font-family: inherit;
      transition: border-color 0.15s;
    }
    .msg-input:focus { border-color: var(--accent); }
    .msg-send-btn {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      color: white;
      font-size: 16px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.15s;
    }
    .msg-send-btn:hover { opacity: 0.85; }

    /* Typing indicator (3 bouncing dots) */
    .flux-typing-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      margin: 0 0 6px 0;
      max-width: 72%;
    }
    .flux-typing-bubble {
      padding: 10px 14px;
      border-radius: 18px;
      background: var(--bg);
      border: 1px solid var(--glass-border);
      border-bottom-left-radius: 4px;
      display: inline-flex;
      align-items: center;
    }
    .flux-typing-dots {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 12px;
    }
    .flux-typing-dots i {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: rgba(107, 114, 128, 0.9);
      transform: translateY(0);
      animation: fluxTypingBounce 1.05s infinite ease-in-out;
    }
    .flux-typing-dots i:nth-child(2) { animation-delay: 0.15s; opacity: 0.9; }
    .flux-typing-dots i:nth-child(3) { animation-delay: 0.30s; opacity: 0.85; }
    @keyframes fluxTypingBounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.55; }
      40% { transform: translateY(-5px); opacity: 1; }
    }

    /* Mention pop (when you get pinged) */
    .flux-mention-pop {
      animation: fluxMentionPop 420ms cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-origin: center bottom;
    }
    @keyframes fluxMentionPop {
      0% { transform: scale(1); }
      40% { transform: scale(1.08); }
      70% { transform: scale(0.98); }
      100% { transform: scale(1); }
    }

    /* Mention picker */
    #mention-menu {
      position: fixed;
      z-index: 99999;
      display: none;
      width: 320px;
      max-height: 260px;
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      box-shadow: 0 18px 55px rgba(0,0,0,0.18);
      padding: 6px;
    }
    .mention-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.1s;
      user-select: none;
    }
    .mention-item:hover, .mention-item.active { background: var(--bg); }
    .mention-avatar {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid rgba(0,0,0,0.06);
    }
    .mention-placeholder {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-weight: 900;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .mention-name { font-size: 13px; font-weight: 900; color: var(--text); line-height: 1.2; }
    .mention-username { font-size: 11px; color: var(--muted); font-weight: 800; margin-top: 2px; }

    /* Mentions inside message bubbles */
    .flux-mention-link {
      font-weight: 900;
      text-decoration: none;
      white-space: nowrap;
    }
    .bubble-other .flux-mention-link {
      color: var(--accent);
    }
    .bubble-own .flux-mention-link {
      color: #ffffff;
    }

    @media (max-width: 768px) {
      #messages-root {
        height: calc(100svh - 120px);
        padding: 0;
        margin: 0;
        flex-direction: column;
        border-radius: 0;
      }
      .convo-sidebar {
        width: 100%;
        height: 260px;
        min-height: 260px;
        border-radius: 0;
        border: none;
        border-bottom: 1px solid var(--glass-border);
      }
      #chat-panel {
        border-radius: 0;
        border: none;
        flex: 1;
        min-height: 0;
      }
    }
  </style>
  <style>

      max-width: 1120px;
      height: calc(100svh - 132px);
      min-height: 500px;
      margin: 28px auto;
      gap: 12px;

    .convo-sidebar, #chat-panel {

    .sidebar-action-btn:hover { background: color-mix(in srgb, var(--accent) 11%, var(--panel)); border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
    #new-dm-btn:hover { background: color-mix(in srgb, var(--accent) 88%, #000 12%); color: #fff; }
    .sidebar-action-btn:active, .msg-send-btn:active { transform: scale(0.97); }
    #convo-list { padding: 10px; }
    .convo-item {
      position: relative;
      gap: 12px;
      padding: 12px;
      margin-bottom: 3px;
      border: 1px solid transparent;

    #chat-panel {

    }
    .chat-header-bar { min-height: 72px; padding: 14px 18px; border-bottom-color: color-mix(in srgb, var(--glass-border) 82%, var(--accent) 18%); background: color-mix(in srgb, var(--panel) 90%, var(--accent) 4%); }
    .back-btn {
      width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid var(--glass-border); border-radius: 10px; background: var(--bg); color: var(--text);
      transition: transform 160ms cubic-bezier(0.23, 1, 0.32, 1), border-color 160ms ease, color 160ms ease;
    }
    .back-btn:hover { border-color: var(--accent); color: var(--accent); transform: translateX(-2px); }
    .messages-list { padding: 22px clamp(16px, 3vw, 32px); gap: 10px; background: linear-gradient(180deg, transparent, color-mix(in srgb, var(--bg) 25%, transparent)); }
    .message-row { max-width: min(76%, 580px); }
    .message-bubble { padding: 11px 15px; border-radius: 16px; box-shadow: 0 3px 11px rgba(15, 23, 36, 0.05); }
    .bubble-own { background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 88%, #fff 12%), var(--accent)); border-bottom-right-radius: 5px; }
    .bubble-other { background: color-mix(in srgb, var(--bg) 86%, var(--panel)); border-color: color-mix(in srgb, var(--glass-border) 92%, var(--accent) 8%); border-bottom-left-radius: 5px; }
    .message-input-bar { padding: 14px 18px; border-top-color: color-mix(in srgb, var(--glass-border) 82%, var(--accent) 18%); background: color-mix(in srgb, var(--panel) 92%, var(--accent) 4%); }

    .msg-input { min-height: 42px; padding: 10px 15px; border-radius: 12px; }
    .msg-input::placeholder { color: var(--muted); opacity: 0.78; }
    .msg-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); }
    .msg-send-btn { width: 42px; height: 42px; border-radius: 12px; box-shadow: 0 6px 14px color-mix(in srgb, var(--accent) 22%, transparent); transition: transform 160ms cubic-bezier(0.23, 1, 0.32, 1), filter 160ms ease; }
    .msg-send-btn:hover { opacity: 1; filter: brightness(1.08); transform: translateY(-1px); }
    .chat-empty, .messages-auth-empty { display: flex; align-items: center; justify-content: center; min-height: 100%; padding: clamp(32px, 8vw, 72px) 26px; text-align: center; }
    .chat-empty-card, .messages-auth-empty-card { max-width: 390px; }
    .chat-empty-symbol, .messages-auth-empty-symbol {

      background: color-mix(in srgb, var(--accent) 11%, var(--panel)); color: var(--accent); font-size: 28px;
      box-shadow: 0 12px 25px color-mix(in srgb, var(--accent) 12%, transparent);
    }
    .chat-empty h2, .messages-auth-empty h2 { font-family: 'Bebas Neue', sans-serif; color: var(--text); font-size: clamp(30px, 4vw, 38px); letter-spacing: 0.025em; margin: 0 0 8px; }
    .chat-empty p, .messages-auth-empty p { max-width: 360px; margin: 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
    .messages-auth-empty { min-height: calc(100svh - 235px); }
    .messages-auth-empty .home-link { display: inline-flex; margin-top: 22px; padding: 10px 18px; border-radius: 10px; background: var(--accent); color: #fff; font-size: 14px; font-weight: 700; text-decoration: none; box-shadow: 0 8px 20px color-mix(in srgb, var(--accent) 24%, transparent); transition: transform 160ms cubic-bezier(0.23, 1, 0.32, 1), filter 160ms ease; }
    .messages-auth-empty .home-link:hover { filter: brightness(1.07); transform: translateY(-1px); }
    @media (max-width: 768px) {
      #messages-root { height: calc(100svh - 112px); min-height: 440px; margin: 0; gap: 0; }
      .convo-sidebar, #chat-panel { border-radius: 0; box-shadow: none; }
      .convo-sidebar { height: 248px; min-height: 248px; }
      .convo-sidebar-header { padding: 14px; }
      .convo-sidebar-title { font-size: 25px; }
      #messages-root.conversation-open .convo-sidebar { display: none; }
      #messages-root.conversation-open #chat-panel { display: flex; }
      .chat-header-bar { min-height: 64px; padding: 12px 14px; }
      .messages-list { padding: 16px; }
      .message-row { max-width: 84%; }
      .message-input-bar { padding: 11px 12px; gap: 7px; }
      .messages-auth-empty { min-height: calc(100svh - 190px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .convo-item, .tab-btn, .sidebar-action-btn, .back-btn, .gif-btn, .msg-send-btn, .messages-auth-empty .home-link { transition: none; }
    }
  </style>

  <div id="global-page-loader" style="position:fixed;inset:0;background:#ffffff;z-index:9999999;display:flex;justify-content:center;align-items:center;transition:opacity 0.4s ease;pointer-events:none;">
    <img src="assets/loading.gif" style="width:250px;height:auto;" alt="Loading...">

  <script>
    // Fast Boot: hide the white loader quickly (best effort)
    (function(){
      const hide = () => {
        try { if (localStorage.getItem('flux_fast_boot') !== '1') return; } catch(e){ return; }
        const el = document.getElementById('global-page-loader');
        if (!el) return;
        el.style.opacity = '0';
        setTimeout(() => { try { el.remove(); } catch(e){} }, 420);
      };
      setTimeout(hide, 80);
      requestAnimationFrame(hide);
      window.addEventListener('pageshow', hide, { once: true });
    })();
  </script>
